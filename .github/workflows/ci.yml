# Runs on every push and pull request. Publishes nothing.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Tests, build and privacy scan
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so the privacy scan can check old commits
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The denylist is private and never committed, so in CI this checks the
      # generic patterns (emails, phone numbers, keys, metadata, commit emails).
      # The full name-and-number check runs on your computer before each push.
      - run: npm run check:privacy

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
